<link rel="icon" type="image/png" href="/favicon-storybook.png" />
<link rel="icon" type="image/svg+xml" href="/favicon-storybook.svg" />
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link rel="preconnect" href="https://rsms.me/" />
<link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/hack-font@3.3.0/build/web/hack-subset.css" />

<style>
  :root {
    --gray-0: light-dark(#ffffff, #0d0d0d);
    --gray-25: light-dark(#fcfcfc, #101010);
    --gray-50: light-dark(#f9f9f9, #131313);
    --gray-75: light-dark(#f3f3f3, #161616);
    --gray-100: light-dark(#ededed, #181818);
    --gray-150: light-dark(#dfdfdf, #1c1c1c);
    --gray-200: light-dark(#c4c4c4, #212121);
    --gray-250: light-dark(#b9b9b9, #292929);
    --gray-300: light-dark(#afafaf, #303030);
    --gray-350: light-dark(#9f9f9f, #393939);
    --gray-400: light-dark(#8f8f8f, #414141);
    --gray-450: light-dark(#767676, #4f4f4f);
    --gray-500: #5d5d5d;
    --gray-550: light-dark(#4f4f4f, #767676);
    --gray-600: light-dark(#414141, #8f8f8f);
    --gray-650: light-dark(#393939, #9f9f9f);
    --gray-700: light-dark(#303030, #afafaf);
    --gray-750: light-dark(#292929, #b9b9b9);
    --gray-800: light-dark(#212121, #c4c4c4);
    --gray-850: light-dark(#1c1c1c, #dcdcdc);
    --gray-900: light-dark(#181818, #ededed);
    --gray-925: light-dark(#161616, #f3f3f3);
    --gray-950: light-dark(#131313, #f3f3f3);
    --gray-975: light-dark(#101010, #f9f9f9);
    --gray-1000: light-dark(#0d0d0d, #ffffff);
    --alpha-base: light-dark(#0d0d0d, #ffffff);
    --alpha-0: color-mix(in srgb, var(--alpha-base) 0%, transparent);
    --alpha-02: color-mix(in srgb, var(--alpha-base) 2%, transparent);
    --alpha-04: color-mix(in srgb, var(--alpha-base) 4%, transparent);
    --alpha-05: color-mix(in srgb, var(--alpha-base) 5%, transparent);
    --alpha-06: color-mix(in srgb, var(--alpha-base) 6%, transparent);
    --alpha-08: color-mix(in srgb, var(--alpha-base) 8%, transparent);
    --alpha-10: color-mix(in srgb, var(--alpha-base) 10%, transparent);
    --alpha-12: color-mix(in srgb, var(--alpha-base) 12%, transparent);
    --alpha-15: color-mix(in srgb, var(--alpha-base) 15%, transparent);
    --alpha-20: color-mix(in srgb, var(--alpha-base) 20%, transparent);
    --alpha-25: color-mix(in srgb, var(--alpha-base) 25%, transparent);
    --alpha-30: color-mix(in srgb, var(--alpha-base) 30%, transparent);
    --alpha-35: color-mix(in srgb, var(--alpha-base) 35%, transparent);
    --alpha-40: color-mix(in srgb, var(--alpha-base) 40%, transparent);
    --alpha-50: color-mix(in srgb, var(--alpha-base) 50%, transparent);

    --sb-input-border-color: light-dark(rgba(0, 0, 0, 0.08), rgba(255, 255, 255, 0.18));
    --sb-input-border-hover-color: light-dark(rgba(0, 0, 0, 0.15), rgba(255, 255, 255, 0.25));
    --sb-input-border-focus-color: light-dark(rgba(0, 0, 0, 0.25), rgba(255, 255, 255, 0.35));
    --color-text: light-dark(var(--gray-750), var(--gray-850));
    --color-text-secondary: light-dark(var(--gray-500), var(--gray-700));
    --color-surface: var(--gray-0);
  }

  /* Storybook sets `color-scheme: light dark` on its UI, which follows the OS instead of the theme toggle */
  #root > div {
    color-scheme: inherit !important;
  }

  /* When the document doesn't know its theme, keep it hidden */
  html:not([data-theme]),
  /* When the story iframe itself is still loading */
  [data-is-loaded="false"] {
    visibility: hidden;
  }

  * {
    /* Aesthetic scrollbar defaults */
    scrollbar-color: var(--alpha-30) transparent;
    scrollbar-width: thin;
  }

  /* Hide the gear icon */
  .sidebar-header button[aria-label="Settings"] {
    display: none !important;
  }

  /* Hide Storybook's search (replaced by the command palette) and the sidebar item context menu ("Open in editor") */
  .sidebar-container [role="search"],
  .sidebar-item [data-testid="context-menu"],
  /* Storybook's change-detection badge for new or modified stories */
  .sidebar-item [data-testid="tree-change-status-button"] {
    display: none !important;
  }

  /* Hide resize handlebar */
  div:has(+ .sidebar-container) {
    display: none;
  }

  /* panel */
  #storybook-panel-region {
    margin-right: 20px;
    margin-left: 20px;
    border: 1px solid var(--gray-150);
    border-bottom: 0;
    border-radius: 8px 8px 0 0;
  }

  #storybook-panel-region div[orientation]::after,
  #storybook-panel-region .sb-bar {
    background: none;
  }

  #storybook-panel-region :is([title^="Change addon orientation"], [aria-label^="Change addon orientation"]) {
    display: none !important;
  }

  /* Sidebar container */
  #root > div > div:nth-child(2),
  div:has(.sidebar-container):not(:has(#storybook-preview-wrapper)) {
    border: 0 !important;
  }

  #storybook-sidebar-region {
    border-right: 1px solid light-dark(var(--gray-100), var(--gray-250));
  }

  /* Header row: the sidebar header and the toolbar share one height and bottom border */
  div:has(> div > .sidebar-header) {
    height: 56px;
    padding: 0 !important;
    border-bottom: 1px solid light-dark(var(--gray-100), var(--gray-250));
  }

  .sidebar-header {
    height: 56px;
    align-items: center !important;
    margin: 0 !important;
    padding: 0 20px !important;
  }

  .sidebar-header a {
    color: var(--color-text) !important;
    font-size: 16px !important;
    font-weight: 600 !important;
    letter-spacing: -0.01em;
    pointer-events: none;
  }

  .sidebar-header a:focus {
    outline: 0;
  }

  [data-testid="sb-preview-toolbar"],
  [data-testid="sb-preview-toolbar"] > div {
    height: 56px !important;
    min-height: 56px !important;
  }

  [data-testid="sb-preview-toolbar"] {
    border-bottom: 1px solid light-dark(var(--gray-100), var(--gray-250));
    box-shadow: none !important;
  }

  /* Sidebar custom nested scroll */
  #storybook-explorer-menu {
    position: absolute;
    top: 56px;
    left: 0;
    right: 0;
    bottom: 0;
    overflow: auto;
    margin: 0;
    padding: 20px 12px 10px;
  }

  /* Sidebar "Roots" - remove expand/collapse and treat as section headings */
  [data-nodetype="root"] {
    pointer-events: none !important;
    color: var(--color-text) !important;
    text-transform: none !important;
    letter-spacing: 0em !important;
    font-size: 14px !important;
    font-weight: 600 !important;
    margin-top: 0px !important;
    margin-bottom: 4px !important;
  }

  .sidebar-item ~ [data-nodetype="root"] {
    margin-top: 20px !important;
  }

  [data-nodetype="root"] button:first-child {
    padding-left: 10px !important;
    color: inherit !important;
    text-transform: none !important;
    letter-spacing: 0em !important;
    font-size: 14px !important;
    font-weight: 600 !important;
  }

  [data-nodetype="root"] button:first-child > div:first-child {
    display: none;
  }

  [data-nodetype="root"] .sidebar-subheading-action {
    display: none;
  }

  /* Sidebar spacing nudges */
  .sidebar-item {
    min-height: auto !important;
    margin-bottom: 2px !important;
    border-radius: 6px !important;
    font-weight: 400 !important;
    transition: background-color 0.1s ease;
  }
  .sidebar-item:not([data-selected="true"]):hover {
    background: light-dark(var(--gray-100), var(--gray-200)) !important;
  }
  .sidebar-item > button {
    align-items: center !important;
  }
  .sidebar-item > button > div {
    margin-top: 0 !important;
  }
  .sidebar-item > button:first-child {
    padding-top: 4px !important;
  }
  .sidebar-item > a:first-child {
    min-height: 36px !important;
    align-items: center !important;
    padding: 0 0 0 10px !important;
    font-weight: inherit !important;
    color: var(--color-text-secondary) !important;
  }
  .sidebar-item:hover > a:first-child,
  .sidebar-item[data-selected="true"] > a:first-child {
    color: var(--color-text) !important;
  }
  .sidebar-item > a:first-child > div {
    display: none !important;
    margin-top: 1px;
  }
  .sidebar-item[data-selected="true"] {
    background: light-dark(var(--gray-100), var(--gray-200)) !important;
    color: var(--gray-900) !important;
    font-weight: 500 !important;
  }

  /* Story args table */
  .docblock-argstable-body td table {
    /* Hide JSDoc tables which are meant for IDE's and not Storybook */
    display: none !important;
  }

  /* Toolbar */
  @media (max-width: 599px) {
    /* Storybook's bottom navigation bar becomes a menu button in the top-left corner */
    #root > div > section:has(button[aria-label="Open navigation menu"]) {
      position: absolute !important;
      height: 0 !important;
      overflow: visible !important;
    }

    #root > div > section:has(button[aria-label="Open navigation menu"]) > header {
      height: 0 !important;
      border: 0 !important;
      background: none !important;
      box-shadow: none !important;
    }

    button[aria-label="Open navigation menu"] {
      position: fixed !important;
      z-index: 10;
      top: 14px;
      left: 8px;
      padding: 4px !important;
      cursor: pointer;
    }

    button[aria-label="Open navigation menu"] svg {
      width: 22px;
      height: 22px;
    }

    #root > div > section:has(button[aria-label="Open navigation menu"]) button:not([aria-label="Open navigation menu"]),
    button[aria-label="Open navigation menu"] p {
      display: none;
    }

    /* Keep toolbar tools clear of the menu button */
    [data-testid="sb-preview-toolbar"] > div {
      padding-left: 48px !important;
    }

    /* Very narrow screens: drop the zoom control so the toolbar fits beside the menu button */
    @media (max-width: 359px) {
      [data-testid="sb-preview-toolbar"] :is([title="Change zoom level"], [aria-label="Change zoom level"]) {
        display: none !important;
      }
    }

  }

  [data-testid="sb-preview-toolbar"] > div {
    align-items: center !important;
    justify-content: flex-end !important;
    gap: 4px;
    width: 100%;
    margin: 0 !important;
    padding: 0 8px;
  }

  /* One row: back link and search on the left, zoom then the remaining tools on the right */
  [data-testid="sb-preview-toolbar"] > div > div:has(> .kova-cmdk-trigger) {
    display: contents;
  }

  [data-testid="sb-preview-toolbar"] > div > div:has(> .kova-cmdk-trigger) > :not(.kova-cmdk-trigger, .story-back-link) {
    order: 1;
  }

  .story-back-link {
    order: -2;
  }

  [data-testid="sb-preview-toolbar"]
    :is(
      [title="Open in isolation mode"],
      [aria-label="Open in isolation mode"],
      [title="Open in editor"],
      [aria-label="Open in editor"]
    ) {
    display: none !important;
  }

  /* Toolbar hide orphan divider */
  .sb-bar > div > div > span:first-child {
    display: none !important;
  }

  #storybook-preview-iframe {
    opacity: 0 !important;
  }
  #storybook-preview-iframe[data-is-loaded="true"] {
    opacity: 1 !important;
  }

  /* Centered, bordered container on wider screens */
  @media (min-width: 600px) {
    html,
    body {
      background: light-dark(var(--gray-50), #000) !important;
    }

    #root > div {
      max-width: 1440px;
      margin-inline: auto;
      border-inline: 1px solid light-dark(var(--gray-100), var(--gray-250));
      background: var(--color-surface);
      grid-template-columns: 260px minmax(0, 1fr) 0 !important;
    }
  }

  /* Command palette trigger, at the start of the toolbar */
  .kova-cmdk-trigger {
    display: inline-flex;
    order: -1;
    align-items: center;
    gap: 8px;
    width: 260px;
    height: 34px;
    margin: 0 auto 0 4px;
    padding: 0 6px 0 10px;
    border: 1px solid light-dark(var(--alpha-10), var(--alpha-12));
    border-radius: 8px;
    background: light-dark(var(--gray-0), var(--alpha-04));
    color: var(--color-text-secondary);
    font: inherit;
    font-size: 14px;
    cursor: pointer;
    transition:
      border-color 0.15s ease,
      color 0.15s ease;
  }

  .kova-cmdk-trigger:hover {
    border-color: light-dark(var(--alpha-20), var(--alpha-25));
    color: var(--color-text);
  }

  .kova-cmdk-trigger:focus-visible {
    outline: 2px solid var(--color-text);
    outline-offset: 1px;
  }

  .kova-cmdk-trigger svg {
    flex-shrink: 0;
  }

  .kova-cmdk-trigger kbd,
  .kova-cmdk-input kbd {
    margin-left: auto;
    padding: 2px 6px;
    border: 1px solid var(--alpha-10);
    border-radius: 4px;
    background: var(--alpha-04);
    color: var(--color-text-secondary);
    font-family: inherit;
    font-size: 12px;
    line-height: 16px;
  }

  @media (max-width: 767px) {
    .kova-cmdk-trigger {
      width: 34px;
      justify-content: center;
      margin-left: 4px;
      padding: 0;
    }

    .kova-cmdk-trigger-label,
    .kova-cmdk-trigger kbd {
      display: none;
    }
  }

  /* On mobile the navigation menu handles finding pages */
  @media (max-width: 599px) {
    .kova-cmdk-trigger {
      display: none;
    }
  }

  /* Command palette */
  .kova-cmdk-overlay {
    position: fixed;
    z-index: 100000;
    inset: 0;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 14vh 16px 16px;
    background: light-dark(rgb(0 0 0 / 0.3), rgb(0 0 0 / 0.6));
    animation: kova-cmdk-fade 0.15s ease;
  }

  .kova-cmdk {
    display: flex;
    flex-direction: column;
    width: 100%;
    max-width: 560px;
    max-height: 100%;
    overflow: hidden;
    border: 1px solid light-dark(var(--alpha-10), var(--gray-250));
    border-radius: 12px;
    background: var(--color-surface);
    box-shadow: 0 16px 48px rgb(0 0 0 / 0.18);
    color: var(--color-text);
    font-family: InterVariable, Inter, ui-sans-serif, system-ui, sans-serif;
    animation: kova-cmdk-enter 0.15s ease;
  }

  .kova-cmdk-input {
    display: flex;
    flex-shrink: 0;
    align-items: center;
    gap: 10px;
    height: 52px;
    padding: 0 12px 0 16px;
    border-bottom: 1px solid light-dark(var(--gray-100), var(--gray-250));
    color: var(--color-text-secondary);
  }

  .kova-cmdk-input input {
    flex: 1;
    min-width: 0;
    height: 100%;
    padding: 0;
    border: 0;
    outline: 0;
    background: transparent;
    color: var(--color-text);
    font: inherit;
    font-size: 15px;
  }

  .kova-cmdk-input input::placeholder {
    color: var(--color-text-secondary);
  }

  .kova-cmdk-list {
    max-height: 360px;
    overflow-y: auto;
    padding: 6px;
    scroll-padding: 6px;
    overscroll-behavior: contain;
  }

  .kova-cmdk-group + .kova-cmdk-group {
    margin-top: 4px;
  }

  .kova-cmdk-heading {
    padding: 8px 10px 4px;
    color: var(--color-text-secondary);
    font-size: 12px;
    font-weight: 500;
  }

  .kova-cmdk-item {
    display: flex;
    align-items: center;
    gap: 10px;
    height: 36px;
    padding: 0 10px;
    border-radius: 6px;
    font-size: 14px;
    cursor: pointer;
    user-select: none;
  }

  .kova-cmdk-item svg {
    flex-shrink: 0;
    color: var(--color-text-secondary);
  }

  .kova-cmdk-item[aria-selected="true"] {
    background: light-dark(var(--alpha-05), var(--alpha-08));
  }

  .kova-cmdk-empty {
    margin: 0;
    padding: 28px 16px;
    color: var(--color-text-secondary);
    font-size: 14px;
    text-align: center;
  }

  @keyframes kova-cmdk-fade {
    from {
      opacity: 0;
    }
  }

  @keyframes kova-cmdk-enter {
    from {
      opacity: 0;
      transform: scale(0.98);
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .kova-cmdk-overlay,
    .kova-cmdk {
      animation: none;
    }
  }
</style>
