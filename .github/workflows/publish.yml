name: Publish packages

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      version:
        description: "Package version to publish, without a leading v"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install npm 11
        run: npm install --global npm@11

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release version
        env:
          EXPECTED_VERSION: ${{ github.event.release.tag_name || inputs.version }}
        run: |
          expected_version="${EXPECTED_VERSION#v}"

          for manifest in packages/*/package.json; do
            package_version="$(node -p "require('./$manifest').version")"
            if [ "$package_version" != "$expected_version" ]; then
              echo "$manifest version $package_version does not match release version $expected_version"
              exit 1
            fi
          done

      - name: Check
        run: |
          pnpm run format
          pnpm run lint
          pnpm run types
          pnpm run test

      - name: Build
        run: pnpm run build

      # pnpm pack turns `workspace:` ranges into real versions, then npm publishes with provenance.
      # Icons go first since kova-ui depends on them, and markdown last since it peers on kova-ui.
      - name: Pack
        run: pnpm --filter "./packages/*" pack --pack-destination "$RUNNER_TEMP/packages"

      - name: Publish
        run: |
          version="$(node -p "require('./packages/ui/package.json').version")"
          for name in kova-ui-icons kova-ui kova-ui-markdown; do
            npm publish "$RUNNER_TEMP/packages/$name-$version.tgz" --access public
          done
